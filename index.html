<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Redes Sociales</title>
    
    <!-- Carga de iconos para las redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 
        ====================================================================
        🎨 🎨 🎨 🔴 AQUÍ PUEDES CAMBIAR LOS COLORES 🔴 🎨 🎨 🎨
        ====================================================================
        */
        :root {
            /* 🟡 Color de fondo para el círculo de tu logo (si tu PNG tiene fondo transparente) */
            --color-circulo-logo: #ffffff; 

            /* Colores para el degradado en movimiento del fondo general */
            --color-fondo-1: #f3bc18;    
            --color-fondo-2: #ee7a15;    
            --color-fondo-3: #f3bc18;    
        }
        /* ==================================================================== */

        body {
            /* Configuración del degradado animado */
            background: linear-gradient(-45deg, var(--color-fondo-1), var(--color-fondo-2), var(--color-fondo-3));
            background-size: 400% 400%;
            animation: moverDegradado 10s ease infinite;
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Animación del fondo */
        @keyframes moverDegradado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contenedor {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* 
        ====================================================================
        🟡 ESTO GARANTIZA EL CÍRCULO PERFECTO (ESTILO FOTO DE PERFIL) 
        ====================================================================
        */
        .contenedor-perfil {
            width: 160px;          /* Ancho exacto del círculo */
            height: 160px;         /* Alto exacto del círculo */
            background-color: var(--color-circulo-logo);
            border-radius: 50%;    /* Hace que sea un círculo perfecto siempre */
            margin: 0 auto 30px auto; /* Lo centra horizontalmente */
            overflow: hidden;      /* 🔴 CLAVE: Recorta cualquier parte de la imagen que se salga del círculo */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-perfil img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 🔴 CLAVE: Hace que la imagen llene todo el círculo y se centre perfectamente */
        }

        /* Estilo Base de los Botones */
        .boton-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .boton-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        .boton-link i {
            position: absolute;
            left: 20px;
            font-size: 24px;
        }

        /* Colores Oficiales de Redes Sociales */
        .btn-facebook {
            background-color: #1877F2; 
        }
        
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-tiktok {
            background-color: #000000; 
        }
    </style>
</head>
<body>

    <div class="contenedor">
        
        <!-- 
        ====================================================================
        🖼️ 🖼️ 🖼️ 🔴 AQUÍ PON EL LINK O NOMBRE DE TU LOGO 🔴 🖼️ 🖼️ 🖼️
        ====================================================================
        -->
        <div class="contenedor-perfil">
            <img src="https://i.ibb.co/wF2K9CJF/LOGO-MOZARELLA.png" alt="Foto de Perfil">
        </div>


        <!-- 
        ====================================================================
        🔗 🔗 🔗 🔴 AQUÍ PON LOS LINKS DE TUS REDES SOCIALES 🔴 🔗 🔗 🔗
        ====================================================================
        -->

        <!-- BOTÓN FACEBOOK -->
        <a href="https://www.facebook.com/MozzarellaPizza.bo" class="boton-link btn-facebook" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook"></i>
            Facebook
        </a>

        <!-- BOTÓN INSTAGRAM -->
        <a href="https://www.instagram.com/mozzarellapizza.bolivia" class="boton-link btn-instagram" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-instagram"></i>
            Instagram
        </a>

        <!-- BOTÓN TIKTOK -->
        <a href="https://www.tiktok.com/@mozzarellapizza.bo" class="boton-link btn-tiktok" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-tiktok"></i>
            TikTok
        </a>
        
        <!-- ==================================================================== -->

    </div>

</body>
</html>
